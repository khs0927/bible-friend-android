[workspace]
resolver = "2"
members = ["crates/bf-core", "apps/bible-friend"]
# The Tauri shell needs WebView system libraries (webkit2gtk on Linux, NDK for
# Android); `cargo test` at the workspace root only builds the pure core.
default-members = ["crates/bf-core"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
unicode-normalization = "0.1"
thiserror = "2"
