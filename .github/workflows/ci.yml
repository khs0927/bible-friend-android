name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Core + mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Edge Functions use the current core copy
        run: pnpm sync:core --check
      - name: Core unit tests
        run: pnpm --filter @bible-friend/core test
      - name: Mobile component tests (jest-expo)
        run: pnpm --filter mobile test -- --ci
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm --filter mobile lint
      - name: Android JS bundle
        run: pnpm --filter mobile export:android

  backend:
    name: Supabase (DB + Edge Functions)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check Edge Functions
        run: pnpm functions:check
      - name: Provider chain unit tests (Deno)
        run: pnpm functions:test
      - name: Start local Supabase
        run: pnpm exec supabase start -x studio,imgproxy,vector,logflare,supavisor,mailpit,realtime
      - name: Database security tests (pgTAP)
        run: pnpm db:test
      - name: Serve Edge Functions
        run: |
          touch supabase/functions/.env
          nohup pnpm exec supabase functions serve --env-file supabase/functions/.env > functions.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w '%{http_code}' -X OPTIONS http://127.0.0.1:54321/functions/v1/growth | grep -qE '^(200|204|401)$'; then break; fi
            sleep 2
          done
      - name: End-to-end smoke test
        run: pnpm smoke
      - name: Functions log
        if: failure()
        run: cat functions.log

  voice-cpu:
    name: Open-source voice server (Supertonic 3 + faster-whisper)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/voice-cpu/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -r services/voice-cpu/requirements.txt
      - name: Start server (small Whisper model keeps CI fast)
        working-directory: services/voice-cpu
        env:
          VOICE_API_KEY: ci-secret
          WHISPER_MODEL: small
          HF_HUB_DISABLE_SYMLINKS_WARNING: '1'
        run: |
          nohup uvicorn app:app --host 127.0.0.1 --port 8808 > server.log 2>&1 &
          for i in $(seq 1 120); do curl -s http://127.0.0.1:8808/healthz | grep -q '"ok":true' && break; sleep 5; done
      - name: Round-trip smoke test
        run: |
          mkdir -p supabase/functions && echo "VOICE_API_KEY=ci-secret" > supabase/functions/.env
          node services/voice-cpu/smoke.mjs
      - name: Server log
        if: failure()
        run: cat services/voice-cpu/server.log

  rust:
    name: Rust (bf-core + Tauri shell)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: WebView system libraries (Tauri on Linux)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
